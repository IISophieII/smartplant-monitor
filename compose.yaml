services:
  monitor:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["telemetry:/app/data"]
    environment:
      DATA_SOURCE: ${DATA_SOURCE:-simulator}
      MODBUS_HOST: device
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 3s
      retries: 3
  device:
    build: .
    profiles: ["modbus"]
    command: ["python", "-m", "smartplant.modbus"]
    environment:
      SIMULATION_MODE: ${SIMULATION_MODE:-normal}
volumes:
  telemetry:
