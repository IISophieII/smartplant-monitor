[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "smartplant-monitor"
version = "0.1.0"
description = "Industrial telemetry and anomaly detection learning platform"
requires-python = ">=3.12"
dependencies = ["fastapi==0.116.1", "uvicorn==0.35.0", "scikit-learn==1.7.1", "pymodbus==3.11.1"]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "httpx==0.28.1", "ruff==0.12.9"]

[tool.setuptools.package-data]
smartplant = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
